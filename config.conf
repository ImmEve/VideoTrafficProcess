[global]

workdir = E:/project/VideoTrafficProcess/

[capture]

tshark_interface = Ethernet
tshark_path = E:/software/Wireshark/tshark.exe
chrome_user_data_path = C:/Users/zzs/AppData/Local/Google/Chrome/User Data
mitmdump_path = E:/software/Python/Scripts/mitmdump.exe

chrome_driver_path = src/capture/chromedriver.exe
pcap_path = data/traffic/
responsebody_path = data/responsebody/
url_list_path = data/url/url_list.csv
url_class_path = data/url/url_class.csv
reurl_path = data/url/reurl.csv
exurl_path = data/url/exurl.csv
errorlog = data/errorlog.txt
time_duration = 300
check_resolution = 1080p ,720p,480p
if_auto_playback = 0
chose_resolution = 720p

[get_segment]

datapath = data/videofile/
fingerpath = data/fingerprint/video.csv
if_ues_url_list = 1

[get_chunk]
fingerpath = data/fingerprint/traffic_extra.csv